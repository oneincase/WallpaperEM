[package]
name = "WallpaperEM"
version = "1.1.0"
description = "WallpaperEM —— 跨平台动态壁纸引擎（Tauri 2.11.2），支持 Steam 工坊视频/场景/网页/图片壁纸"
license = "MIT"
edition = "2021"

[lib]
name = "we_wallpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dirs = "5"
glob = "0.3"
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api 在非 macOS 目标上是惰性 cfg（wry 内部仅 macOS 使用），
# 且 tauri-build 会校验它与 tauri.conf.json 的 macOSPrivateApi 一致，故保持开启
tauri = { version = "2.11.2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-desktop-underlay = "0.2"
# 应用内更新：签名校验 + 平台静默安装 + 重启（见 src/update.rs）
tauri-plugin-updater = "2"
# window-vibrancy 仅在 macOS/Windows 有实际实现，Linux 下为空 crate（编译安全）
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# 分享页属性实时推送的 SSE body：mpsc Receiver → Stream（axum Body::from_stream）
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
fs2 = "0.4"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "system-proxy"] }
regex = "1"
url = "2"
rand = "0.8"
chrono = "0.4"
sha2 = "0.10"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
libc = "0.2"
# MCP 回环监听绑定：SO_REUSEADDR（TIME_WAIT 残留导致改端口必报占用的解法）
socket2 = "0.6"
# 网络服务的本机局域网地址探测（设置页展示/分享链接 host/Origin 校验共用）：
# 枚举网卡挑物理网卡的私网 IPv4 —— 默认路由可能走 VPN 隧道（utun fake-ip），
# UDP 默认路由探测在挂代理的机器上会拿到无用地址，故只作兜底
if-addrs = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
# 封面转码（远端封面 png / 静态 webp → preview.jpg，见 cover_cache）：
# 纯 Rust 无 C 依赖。tauri 本身就带了这个 crate（只开 png），这里只是多开
# jpeg/webp 两个解码器，不额外引入第二套图像栈
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# 全平台媒体桥接（正在播放元数据/封面/歌词 + 系统音频采集 + 反向控制）。
# 与 webwallgl 一样走同级自有仓库 file: 依赖；default-features 关掉 http
# （宿主有自己的内容服务器），audio 提供三平台采集，embedded/online 提供
# 本地内嵌标签与在线歌词/远端封面（Linux MPRIS 常见）
media-bridge = { path = "../../media-bridge/crates/media-bridge", default-features = false, features = ["audio", "embedded", "online"] }

# Steamworks SDK 没有 ARM64 版的 Windows steam_api 库：Windows ARM64 上不编译
# 工坊上传（steamworks / workshop_upload 模块整体关闭），其余平台照常
[target.'cfg(not(all(target_os = "windows", target_arch = "aarch64")))'.dependencies]
steamworks = "0.13.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray"] }
objc2-core-graphics = "0.3"
# 系统全局音频捕获（二期）：macOS 走 CoreAudio 进程 Tap（14.2+，纯 C ABI +
# 裸 msg_send，无需 ScreenCaptureKit 专属 crate）。下面四个供抽帧（core_media）、
# 桌面窗口事件监听（dispatch2/block2）等其它 macOS 原生路径使用
objc2-core-media = { version = "0.3", features = ["objc2-core-audio-types"] }
objc2-core-audio-types = "0.3"
dispatch2 = { version = "0.3", default-features = false, features = ["alloc", "objc2", "block2"] }
block2 = { version = "0.6", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 凭据存储：内核 keyutils（keyring 的 linux-native；无 D-Bus 依赖，免 DE 配合）。
# 注：主凭据走 secure_store 本地加密文件，keychain.rs 仅为旧版回退/迁移来源，
# keyutils 非持久化的限制不影响主流程。
keyring = { version = "3", features = ["linux-native"] }
# 「正在播放」/ 系统音频统一走 media-bridge（Linux 侧由其经 zbus 接 MPRIS）
# gtk 直依赖：与 tao/desktop-underlay 同一大版本（0.18），用于壁纸窗口 realize 状态检测
gtk = "0.18"
# 主窗口模糊（KDE KWin，见 blur.rs）：X11 设 _KDE_NET_WM_BLUR_BEHIND_REGION；
# Wayland 走 org_kde_kwin_blur。client_system = 复用 GDK 的系统 wl_display 连接
x11rb = "0.13"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows 凭据存储：Credential Manager（与 macOS apple-native / Linux linux-native 对齐；
# 主凭据同样走 secure_store 本地加密文件，keychain.rs 仅为旧版回退/迁移来源）
keyring = { version = "3", features = ["windows-native"] }
# 桌面层窗口（WorkerW 父子化）、系统光标/按键、全局音频 loopback（WASAPI）、
# 「正在播放」（GSMTC）、ConPTY（steamcmd 交互）都直调 Win32/WinRT。
# 版本与 tauri 2.11 / tauri-plugin-desktop-underlay 保持一致（同一份 HWND 类型）。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Media",
    "Media_Control",
    "Foundation",
    "Storage",
    "Storage_Streams",
] }
