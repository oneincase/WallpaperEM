name: 打包 macOS DMG

# 推送形如 v0.1.0 的标签时触发（tag 号需与 src-tauri/tauri.conf.json 的 version 一致）。
on:
  push:
    tags:
      - 'v*'
  # 也可以在 Actions 页面手动触发
  workflow_dispatch: {}

# 需要读取仓库 + 写 release 附件
permissions:
  contents: write

concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    # 发布前置检查（三处版本一致 / tag 对得上 / CHANGELOG 已归段）：几秒钟拦在
    # 最便宜的 runner 上 —— 不过，下面这个按分钟计费的构建根本不会启动。
    # 规则见 docs/pr-rules.md §8。
    uses: ./.github/workflows/release-preflight.yml

  build-dmg:
    needs: [preflight]
    # universal 包（arm64 + x86_64/Intel）必须在 arm64 宿主上构建 → macos-14 是 ARM 运行器。
    # Tauri 会把两个 target 的产物 lipo 合并成一个 .app/.dmg。
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # webwallgl 是自维护渲染库，未发 npm；package.json 里依赖的是
      # `file:../webwallgl-github/dist/lib`，必须与仓库平级检出并先构建出 dist/lib，
      # 否则 `pnpm install` 直接 ENOENT 失败（别的平台工作流已这么做，这里补齐）。
      - name: 检出 webwallgl
        uses: actions/checkout@v4
        with:
          repository: oneincase/webwallgl
          path: webwallgl-github-src

      # media-bridge 同样是同级自有仓库（src-tauri/Cargo.toml 里
      # path = "../../media-bridge/crates/media-bridge"），缺了它 cargo 直接报
      # 找不到 path 依赖；纯 Rust 依赖，检出即可
      - name: 检出 media-bridge
        uses: actions/checkout@v4
        with:
          repository: oneincase/media-bridge
          path: media-bridge-src

      # actions/checkout 不允许直接检出到 workspace 外，先落到子目录再移到平级
      - name: 移动到仓库平级目录
        run: |
          mv webwallgl-github-src ../webwallgl-github
          mv media-bridge-src ../media-bridge

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal 需要两个 target 同时安装（Intel 切片由 x86_64 提供）
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy,rustfmt

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与本地一致：读取 lockfile v9，且兼容 pnpm-workspace.yaml 的 allowBuilds
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 需要 Node >= 22.13；Node 20 已被 GitHub Actions 弃用，改用 LTS 22
          node-version: 22
          cache: pnpm

      # 不用 --frozen-lockfile：webwallgl 自身在迭代，其 lockfile 可能滞后于源码；
      # 这里优先「能构建出 dist/lib」。WallpaperEM 自身仍走 frozen，保证可复现。
      - name: 构建 webwallgl 库产物（dist/lib）
        working-directory: ../webwallgl-github
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build:lib

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 签名证书（可选但强烈建议）：macOS 的 TCC 权限（录屏、辅助功能等）绑定在
      # 应用的代码签名上。ad-hoc 签名（"-"）每次构建的签名哈希都不同，用户每次
      # 安装新包都要重新授权录屏权限。把同一把证书的 .p12 存进仓库 Secrets
      # （MACOS_CERTIFICATE_P12 = base64 内容、MACOS_CERTIFICATE_PWD = 导出密码，
      # 可选 vars.MACOS_CERTIFICATE_NAME = 证书名，缺省用
      # tauri.conf.json 里的 "WallpaperEM Dev Signer"），每次构建用同一把签，
      # 授权即可跨版本保留。证书更换 = 用户需重新授权一次。
      # 注意：secrets 上下文不能用在步骤级 if 里（会导致整个 workflow 文件解析失败），
      # 判空放在脚本里做
      - name: 导入签名证书（存在 Secrets 时）
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "未配置 MACOS_CERTIFICATE_P12，跳过证书导入（ad-hoc 签名）"
            exit 0
          fi
          CERT_P12_PATH=$RUNNER_TEMP/wallpaperem-sign.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PWD=$(openssl rand -hex 16)
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_P12_PATH"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_P12_PATH" -k "$KEYCHAIN_PATH"             -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:             -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # macOS 15.4+ 起 MediaRemote 只对「被授权」的进程返回数据：media-bridge 必须把
      # helper 动态库嵌进主二进制、运行时落盘、再由 /usr/bin/perl 加载代读（详见
      # media-bridge README「macOS 15.4+ 权限通道」）。
      #
      # **不能指望 build-dependency 自动嵌**：带 `--target`（universal 构建必然带）时，
      # build-dependency 的 cdylib 落在宿主布局 target/<profile>/deps/，而 media-bridge
      # 的 build.rs 只查 target/<triple>/<profile>/，找不到就**静默不嵌** —— 运行时退回
      # 进程内直连，在 15.4+ 上只会拿到空字典：封面/歌名/艺人/进度全空，status 却照报
      # Running（v2.1.0 的 macOS 包就是这么发出去的）。所以这里显式按两个架构各建一份、
      # lipo 合成 universal，用 build.rs 认的 MB_MAC_HELPER_DYLIB 指给构建。
      #
      # 输出路径每次都相同、且按内容替换文件：这个路径会进 MB_MAC_HELPER_DYLIB，值或
      # 文件 mtime 一变，build.rs 的 rerun-if-env-changed / rerun-if-changed 就判定失效，
      # media-bridge 连同所有下游 crate（含主 crate）整条重编，Rust 缓存等于没有。
      - name: 构建 macOS helper 动态库（供主二进制内嵌）
        run: |
          set -euo pipefail
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p media-bridge-mac-helper \
              --manifest-path ../media-bridge/Cargo.toml --target "$triple"
          done
          helper="$GITHUB_WORKSPACE/../media-bridge/target/libmedia_bridge_mac_helper.dylib"
          lipo -create \
            ../media-bridge/target/aarch64-apple-darwin/release/libmedia_bridge_mac_helper.dylib \
            ../media-bridge/target/x86_64-apple-darwin/release/libmedia_bridge_mac_helper.dylib \
            -o "$helper.new"
          if [ -f "$helper" ] && cmp -s "$helper.new" "$helper"; then
            rm "$helper.new"
          else
            mv "$helper.new" "$helper"
          fi
          echo "MB_MAC_HELPER_DYLIB=$helper" >> "$GITHUB_ENV"
          # 变量后紧跟全角字符时必须用 ${} 包起来：bash 会把「（」的字节当成变量名的一部分
          echo "helper 已就绪：${helper}（架构 $(lipo -archs "$helper")）"

      - name: 构建 Tauri（.app + .dmg）
        # beforeBuildCommand 会先跑 pnpm --filter @we/desktop build 生成前端 dist/，
        # 再编译 Rust release 并打包 app/dmg。
        #
        # 签名：优先仓库 Variables 的 APPLE_SIGNING_IDENTITY（Developer ID 正式包），
        # 其次 Secrets 里那把自签名证书（见上一步；作用是固定签名让 TCC 授权跨版本
        # 保留），都没有才退回 ad-hoc（"-"，仅能出包，用户每次安装都要重授权录屏）。
        # 要出可对外分发的正式包，另补 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
        # APPLE_ID 等公证 secrets。
        env:
          # 优先级：Developer ID（Variables）→ Secrets 证书名 → 导入了证书时用
          # 默认自签名证书名 → ad-hoc（无任何证书，授权无法跨版本保留）
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY || secrets.MACOS_CERTIFICATE_NAME || (secrets.MACOS_CERTIFICATE_P12 != '' && 'WallpaperEM Dev Signer' || '-') }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # updater 签名密钥（createUpdaterArtifacts 生成 .app.tar.gz.sig 用）。
          # 私钥内容存 Secrets：TAURI_SIGNING_PRIVATE_KEY（~/.tauri/wallpaperem.key 文件内容）、
          # 该密钥无密码，故 PASSWORD 留空串
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin

      # 防静默回归：主二进制里必须真的嵌着 helper —— 这是 macOS 15.4+ 唯一能读到
      # 「系统正在播放」的通道，而嵌不上时应用不报错、只是永远拿不到数据（见上面
      # helper 步骤的说明）。判据是 helper 独有的字符串（它内部 dispatch queue 的
      # label，宿主代码里没有）。逐架构切片检查：交叉构建时若只嵌了宿主架构那一份，
      # Intel 切片会坏，而整包 grep 只会看到一个 arm64 命中。
      - name: 断言 helper 已嵌入主二进制（逐架构切片）
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
            -maxdepth 1 -name '*.app' -print -quit)
          [ -n "$app" ] || { echo "::error::没找到 .app（产物路径变了？）"; exit 1; }
          bin="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          [ -f "$bin" ] || { echo "::error::没找到主二进制 $bin"; exit 1; }
          for arch in $(lipo -archs "$bin"); do
            slice="$RUNNER_TEMP/slice-$arch"
            # 单架构产物（没走 universal 的本地/单人构建）不用抽切片，直接查原文件
            if [ "$(lipo -archs "$bin" | wc -w | tr -d ' ')" -gt 1 ]; then
              lipo -thin "$arch" -o "$slice" "$bin"
            else
              cp "$bin" "$slice"
            fi
            # 直接 grep 二进制（-a 当文本扫）：**不要**写成 `strings | grep -q` ——
            # 脚本开了 pipefail，grep -q 命中即退出会让 strings 吃 SIGPIPE，管道状态
            # 变成 141，明明命中也判成失败。
            if grep -aq 'media-bridge.helper' "$slice"; then
              echo "$arch 切片：helper 已内嵌 ✅"
            else
              echo "::error::$arch 切片没有内嵌 media-bridge helper —— 该平台上 macOS 15.4+ 的「正在播放」（封面/歌名/进度）会是空的。查上面的 helper 构建步骤与 MB_MAC_HELPER_DYLIB 是否生效。"
              exit 1
            fi
          done

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          # universal 构建的产物在 target/universal-apple-darwin/ 下
          name: WallpaperEM-macos-universal-${{ github.ref_name }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

      - name: 把 DMG 附加到对应 tag 的 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 标题取标签名（如 v0.1.0），自动创建/更新 tag 对应的 release
          name: ${{ github.ref_name }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          draft: false
          prerelease: false

      # updater 清单（应用内更新的端点）：内容含下载地址 + minisign 签名。
      # universal 包对两种架构是同一个 .app.tar.gz → darwin-aarch64 / darwin-x86_64
      # 两个清单文件内容相同，仅文件名不同（端点按 {{target}}-{{arch}} 拼 URL）。
      - name: 生成并上传 updater 更新清单
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --json body -q .body > "$RUNNER_TEMP/release-notes.md" || : > "$RUNNER_TEMP/release-notes.md"
          node scripts/gen-update-manifest.mjs \
            --repo "${{ github.repository }}" \
            --tag "$GITHUB_REF_NAME" \
            --file latest-darwin-aarch64.json \
            --target darwin-aarch64 --target darwin-x86_64 \
            --asset src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          cp latest-darwin-aarch64.json latest-darwin-x86_64.json
          gh release upload "$GITHUB_REF_NAME" latest-darwin-aarch64.json latest-darwin-x86_64.json \
            --repo "${{ github.repository }}" --clobber
