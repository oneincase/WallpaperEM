name: 打包 macOS DMG

# 推送形如 v0.1.0 的标签时触发（tag 号需与 src-tauri/tauri.conf.json 的 version 一致）。
on:
  push:
    tags:
      - 'v*'
  # 也可以在 Actions 页面手动触发
  workflow_dispatch: {}

# 需要读取仓库 + 写 release 附件
permissions:
  contents: write

concurrency:
  group: build-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dmg:
    # universal 包（arm64 + x86_64/Intel）必须在 arm64 宿主上构建 → macos-14 是 ARM 运行器。
    # Tauri 会把两个 target 的产物 lipo 合并成一个 .app/.dmg。
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal 需要两个 target 同时安装（Intel 切片由 x86_64 提供）
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy,rustfmt

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与本地一致：读取 lockfile v9，且兼容 pnpm-workspace.yaml 的 allowBuilds
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 需要 Node >= 22.13；Node 20 已被 GitHub Actions 弃用，改用 LTS 22
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Tauri（.app + .dmg）
        # beforeBuildCommand 会先跑 pnpm --filter @we/desktop build 生成前端 dist/，
        # 再编译 Rust release 并打包 app/dmg。
        #
        # 签名：tauri.conf.json 的 bundle.macOS.signingIdentity 写的是本机证书名，
        # CI 上不存在会让构建直接失败。默认 ad-hoc 签名（"-"）先把包出出来；要出
        # 可对外分发的正式包，在仓库 Variables 里设
        # APPLE_SIGNING_IDENTITY=<Developer ID 证书名>，并补
        # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_ID 等 secrets。
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY || '-' }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm tauri build --target universal-apple-darwin

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          # universal 构建的产物在 target/universal-apple-darwin/ 下
          name: WallpaperEM-macos-universal-${{ github.ref_name }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

      - name: 把 DMG 附加到对应 tag 的 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 标题取标签名（如 v0.1.0），自动创建/更新 tag 对应的 release
          name: ${{ github.ref_name }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          draft: false
          prerelease: false
