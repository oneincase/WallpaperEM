name: 测试打包（macOS / Linux / Windows，不发布）

# 用途：手动触发，一次性构建三平台安装包，**只上传 artifact，绝不创建 Release**。
# 发布仍由 `build-dmg.yml` / `build-linux.yml` / `build-windows.yml` 在推送 v* 标签时
# 完成 —— 推 tag 就是人工确认那一步；本 workflow 不监听 tag、也不写 contents。
#
# webwallgl 是自维护渲染库，最新的改动只在你自己的仓库里（暂未发到 npm），
# 所以这里始终从 GitHub 源码检出并构建 dist/lib，再让 `file:../webwallgl-github/dist/lib`
# 依赖解析到它。可用 webwallgl_ref 指定要测的分支 / 标签 / SHA。
on:
  workflow_dispatch:
    inputs:
      webwallgl_ref:
        description: 'webwallgl 的 ref（分支 / 标签 / commit SHA）；留空用其默认分支'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      # 一个平台失败不影响其它平台继续出包（测试场景更关心看到全部结果）
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            # universal：一个包同时含 arm64（Apple Silicon）与 x86_64（Intel）。
            # 两个 rust target 都要装，Tauri 用 --target universal-apple-darwin 合并；
            # 产物落在 target/universal-apple-darwin/... 而不是 target/release/...
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            build_args: --target universal-apple-darwin
            label: macOS-universal
            bundles: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          - os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            label: Linux-x64
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: ubuntu-24.04-arm
            # 原生 arm64 runner（公共仓库可用）：不做交叉编译，装依赖后直接编。
            # 产物路径带 triple（显式 --target），与 x64 行互不覆盖。
            targets: aarch64-unknown-linux-gnu
            build_args: --target aarch64-unknown-linux-gnu
            label: Linux-arm64
            bundles: |
              src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            label: Windows-x64
            bundles: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: windows-latest
            # Windows ARM64（Surface Pro X、骁龙本等）：GitHub 没有稳定的 arm64 Windows
            # runner 标签，所以在 x64 runner 上交叉编译 —— 装上 aarch64-pc-windows-msvc
            # 目标，并把 MSVC 环境切到 VS 自带的 ARM64 工具链（windows-latest 镜像已装）。
            targets: aarch64-pc-windows-msvc
            msvc_arch: arm64
            build_args: --target aarch64-pc-windows-msvc
            label: Windows-arm64
            bundles: |
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 先拉平级目录并把 dist/lib 构建出来，否则 pnpm install 解析不到 file: 依赖
      - name: 检出 webwallgl（源码）
        uses: actions/checkout@v4
        with:
          repository: oneincase/webwallgl
          ref: ${{ inputs.webwallgl_ref }}
          path: webwallgl-github-src

      # actions/checkout 不允许直接检出到 workspace 之外，先落子目录再移平级
      - name: 移到仓库平级目录
        shell: bash
        run: mv webwallgl-github-src ../webwallgl-github

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            xdg-utils

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 这里**不**用 --frozen-lockfile：webwallgl 正在迭代，lockfile 可能滞后于源码；
      # 测试构建优先「能装出来」。WallpaperEM 自身仍走 frozen，保证仓库状态可复现。
      - name: 构建 webwallgl dist/lib
        working-directory: ../webwallgl-github
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build:lib

      - name: 记录 webwallgl 版本（便于确认测的是哪一版）
        shell: bash
        run: |
          echo "webwallgl version: $(node -p "require('../webwallgl-github/dist/lib/package.json').version")"
          echo "webwallgl ref: ${{ inputs.webwallgl_ref || '(默认分支)' }}"
          echo "wallpaperem version: $(node -p "require('./src-tauri/tauri.conf.json').version")"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 切换 MSVC 工具链到 ARM64（仅 Windows arm64 行）
        # 交叉编译 aarch64-pc-windows-msvc 要用 VS 的 ARM64 cl.exe/link.exe；
        # 该 action 会把这套环境导出到后续步骤（INCLUDE/LIB/PATH）。
        if: matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: 钉死 MSVC 的 ARM64 link.exe（仅 Windows arm64 行）
        # 只靠 PATH 不够稳：runner 的 `C:\Program Files\Git\usr\bin` 里也有一份
        # link.exe（coreutils 的 link），rustc 会解析到它并报
        # `linking with link.exe failed`（上一次 CI 就挂在这，日志里能看到
        # 它调的是 Git 那份）。用 Rust 官方的 CARGO_TARGET_<TRIPLE>_LINKER 指定。
        if: matrix.msvc_arch
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\arm64\link.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostarm64\arm64\link.exe"
          )
          $link = $null
          foreach ($c in $candidates) {
            $link = Get-ChildItem -Path $c -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if ($link) { break }
          }
          if (-not $link) { throw "找不到 MSVC ARM64 的 link.exe" }
          Write-Host "MSVC ARM64 linker = $link"
          "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$link" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 构建（不签名、不发 Release）
        # tauri.conf.json 里 bundle.macOS.signingIdentity 写的是本机证书名
        # （"WallpaperEM Dev Signer"），CI 上并不存在，直接构建会失败。
        # 测试包用 ad-hoc 签名（"-"）兜底；以后要真签名，在仓库 Variables 里
        # 加 APPLE_SIGNING_IDENTITY=<证书名> 即可覆盖，不用改本文件。
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY || '-' }}
          # 没有配置签名证书时不要去自动发现钥匙串身份（会浪费几十秒并报错）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # runner 镜像不带 FUSE 后，linuxdeploy 的 AppImage 起不来（秒退，
          # 表现为 "failed to run linuxdeploy"）；官方无 FUSE 运行模式兜底
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm tauri build ${{ matrix.build_args }} --verbose

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperEM-test-${{ matrix.label }}-${{ github.sha }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
