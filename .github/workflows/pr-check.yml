name: PR 校验（规则 / 前端 / Rust）

# 用途：每个 PR **以及每次直推 `main`** 都跑一遍**能挡住问题**的那几道门禁，
#       手动触发（workflow_dispatch）可把同一套门禁跑在任意 ref 上。
#       规则全文见 docs/pr-rules.md。
#
# 设计原则（重要，改这个文件前先读）：
#   门禁分两档 —— **阻断**（exit 非 0 就红）与**报告**（continue-on-error，只贴结果不挡人）。
#   分档依据是"当前基线到底过不过"，不是"这条规则听起来重不重要"：
#     · `tsc --noEmit`          → 基线通过（本次实测 exit 0）　　　→ 阻断
#     · `i18n-audit.mjs`        → 基线通过（退出码 1 才代表缺译）　→ 阻断
#     · `cargo check`           → 基线通过　　　　　　　　　　　　→ 阻断
#     · 版本号三处一致　　　　　→ 基线通过　　　　　　　　　　　　→ 阻断
#     · `cargo fmt --check`     → 基线**不过** → **棘轮**（2026-09-29 起）：读数进
#                                 scripts/gate-baseline.json，**比基线差才红**、比基线好
#                                 提示收紧。它替代了原来的 continue-on-error —— 纯"报告"
#                                 的日志没人看，数字会悄悄往上涨；全仓格式化仍是独立一件事
#                                 （§5），所以也不做一把梭阻断。
#     · `cargo clippy`          → 同上（棘轮，去重后的 50 条）
#     · `cargo test --lib`      → 基线本机 255 passed / 0 failed / 2 ignored（设备与网络类
#                                 测试已 `#[ignore]`）→ 报告；Linux 侧基线待第一次 push 校验
#                                 量出来后翻正（docs/pr-rules.md §6）
#   把没过基线的检查设成阻断，只会让每个 PR 都红、然后所有人学会无视 CI。
#   要"翻正式"：先把基线清干净，再把对应的 continue-on-error 删掉 —— 一次一条。
#
# 本 workflow **不发布任何东西**：发布仍由 build-dmg / build-linux / build-windows
# 在推 v* 标签时完成；三平台整包测试仍是手动触发 build-test.yml。
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # §0.1 之后**直推 main 是常态**，而 PR 门禁拦不住它 —— 推送也跑一遍同样的校验。
  # 这是**后置**校验（提交已经进 main 了），作用是"红得早、回滚得快"，不是挡住推送。
  push:
    branches: [main]
  # 手动触发：想在推送前就把全量门禁跑一遍（§6 说的"直推前自己跑一遍"现在可以在服务端做：
  #   gh workflow run pr-check.yml -r main ）；也是量 Linux 侧基线的入口（棘轮的平台键、
  #   单元测试档）。跑哪个 ref 用 Run workflow 的分支下拉框选，不需要额外 input。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR 按 PR 号去重（同一 PR 连续推只留最后一次）；push/dispatch 按 ref 去重。
  # 用 github.ref 而不是 event 名：PR 的 ref 是 refs/pull/N/merge，天然按 PR 隔开。
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 变更范围
  # 只跑该跑的：纯文档 PR 不该等 Rust 编译，纯 Rust PR 不该装 pnpm。
  scope:
    name: 变更范围
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      web: ${{ steps.diff.outputs.web }}
      rust: ${{ steps.diff.outputs.rust }}
      # 供 rules job 复用：同一个范围用一处算，别让两个 job 各算一套再互相打架
      range: ${{ steps.range.outputs.range }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 要跟 base 分支算 diff，浅克隆没有共同祖先
          fetch-depth: 0

      - name: 取 PR head 到本地（fork 来的 PR 也取得到）
        # 直接用 head.sha 在 fork PR 上可能不在 base 仓库的对象库里；PR 的 head ref
        # 一定在：refs/pull/<N>/head。统一走它，同仓库 / fork 两种情况都成立。
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"

      # 算出本次要 diff 的范围。原则：**范围拿不准就跑全部** —— 宁可多花几分钟，
      # 也不要因为算错范围而漏掉该跑的检查。
      #   pull_request → origin/<base>...origin/pr-head（三方点 = merge-base 之后）
      #   push         → <before>..<sha>（这次推送改了什么）
      #   dispatch     → all（手动触发的意图就是"整体跑一遍"）
      - name: 算出改动范围
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          range=all
          case "$EVENT" in
            pull_request)
              range="origin/${BASE_REF}...origin/pr-head" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="${PUSH_BEFORE}..${HEAD_SHA}"
              else
                echo "::warning title=拿不到 push 之前的提交::新分支或强推场景，退化为跑全部检查"
              fi ;;
          esac
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "→ 范围：$range"

      - name: 判定改动范围
        id: diff
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          if [ "$RANGE" = "all" ] || ! git diff --name-only "$RANGE" > /tmp/changed.txt 2>/dev/null; then
            # 拿不到 diff 时**保守跑全部**：宁可多花几分钟，也不要放过该跑的检查
            echo "::warning title=无法确定改动范围::退化为跑全部检查"
            : > /tmp/changed.txt
            echo "src/__all__" >> /tmp/changed.txt
            echo "src-tauri/__all__" >> /tmp/changed.txt
          fi
          echo "改动文件（$(wc -l < /tmp/changed.txt | tr -d ' ') 个）："
          sed 's/^/  /' /tmp/changed.txt | head -50

          web=false; rust=false; other=false
          while IFS= read -r f; do
            case "$f" in
              src/*|public/*|index.html|vite.config.ts|tsconfig.json|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|scripts/i18n-audit.mjs) web=true ;;
              src-tauri/*) rust=true ;;
              *) other=true ;;
            esac
          done < /tmp/changed.txt

          docs_only=false
          if [ "$web" = false ] && [ "$rust" = false ] && [ "$other" = true ]; then docs_only=true; fi

          {
            echo "web=$web"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"
          echo "→ 前端=$web Rust=$rust 纯文档=$docs_only"

  # ---------------------------------------------------------------- 提交规则
  # commit-msg-lint.mjs 与本地钩子是同一份规则、同一个脚本 —— 本地能过，CI 就能过。
  rules:
    name: 提交规则
    needs: scope
    runs-on: ubuntu-latest
    # fetch-depth: 0 要拉全量历史（本仓库 .git 约 180MB），留够时间
    timeout-minutes: 10
    env:
      # 三种事件各自要校验什么（范围的算法在 scope job，一处算、这里复用）
      EVENT: ${{ github.event_name }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      PUSH_BEFORE: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
      RANGE: ${{ needs.scope.outputs.range }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 校验范围要能追到 base 分支的提交
          fetch-depth: 0

      - name: 取 PR head 到本地（fork 来的 PR 也取得到）
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"

      - name: PR 标题（squash 后会成为 main 上的提交标题）
        # 只有 PR 才有标题；push / 手动触发没有，跳过而不是拿空串去校验
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/commit-msg-lint.mjs --title "$PR_TITLE"

      - name: 范围内所有提交
        # push 也查这一项 —— 它是「提交信息」这道规则**唯一**的服务端兜底：
        # 本地 `--no-verify` 绕过钩子后，只有这里能发现。
        run: |
          case "$EVENT" in
            pull_request) range="origin/${BASE_REF}..origin/pr-head" ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                range="${PUSH_BEFORE}..${HEAD_SHA}"
              else
                range="${HEAD_SHA}~1..${HEAD_SHA}"
              fi ;;
            *) range="${HEAD_SHA}~1..${HEAD_SHA}" ;; # 手动触发：至少校验最新一条；更宽的范围本地跑
                                                     #   pnpm lint:commit --range <范围>
          esac
          echo "→ 提交信息校验范围：$range"
          git log --oneline "$range" || true
          node scripts/commit-msg-lint.mjs --range "$range"

      - name: PR 描述（改动 / 验证必填）
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          node scripts/commit-msg-lint.mjs --body-file /tmp/pr-body.md --require-sections

      - name: 版本号一致性（package.json / tauri.conf.json / Cargo.toml）
        # 三处权威版本必须相同；bin-info.plist（dev 版内嵌）不一致只警告不阻断
        run: node scripts/check-versions.mjs

      - name: 门禁脚本自身的回归测试
        # 提交粒度那条规则是本地的（CI 看不到当时的暂存边界，见 docs/pr-rules.md §2），
        # 但这些脚本会拦本地提交、会替人写提交 —— 它们坏了比规则松了更糟，所以在这里守一道。
        # 零依赖、全在临时仓库/注入 runner 里跑，不需要 pnpm install。
        # 用 shell 展开的 glob（`node --test scripts/` 在 Node 24 上会把目录当模块加载而报错）。
        run: node --test scripts/*.test.mjs

      - name: 代码变更是否补了 CHANGELOG（建议项，不阻断）
        continue-on-error: true
        run: |
          if [ "$RANGE" = "all" ]; then
            echo "::notice title=改动范围未知::跳过 CHANGELOG 提醒（范围拿不准时它没有判据）"
            exit 0
          fi
          files=$(git diff --name-only "$RANGE")
          if echo "$files" | grep -qE '^(src/|src-tauri/src/)' && ! echo "$files" | grep -q '^CHANGELOG.md$'; then
            echo "::warning title=未更新 CHANGELOG.md::改到了 src/ 或 src-tauri/src/ 但没动 CHANGELOG.md —— 用户可见的变更请在 [Unreleased] 下留一条"
          else
            echo "CHANGELOG 检查通过（或本次改动不需要）"
          fi

  # ---------------------------------------------------------------- 前端
  web:
    name: 前端校验
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # webwallgl 是同级自有仓库：package.json 依赖 `file:../webwallgl-github/dist/lib`，
      # dist/lib 是构建产物不在源码里，必须先检出源码并构建，否则 pnpm install 解析不到。
      - name: 检出 webwallgl（源码）
        uses: actions/checkout@v4
        with:
          repository: oneincase/webwallgl
          path: webwallgl-github-src

      - name: 移到仓库平级目录
        run: mv webwallgl-github-src ../webwallgl-github

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 同 build-test.yml：webwallgl 在迭代，lockfile 可能滞后于源码，这里不要求 frozen
      - name: 构建 webwallgl dist/lib
        working-directory: ../webwallgl-github
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build:lib

      - name: 安装依赖（frozen，保证仓库状态可复现）
        run: pnpm install --frozen-lockfile

      - name: 类型检查（tsc --noEmit）
        run: pnpm typecheck

      - name: 中英词条审计
        # 中文原文当键 + 查不到就原样显示中文 —— 漏翻编译器看不见，退出码 1 就是漏了
        run: node scripts/i18n-audit.mjs

      - name: 构建产物（vite build）
        run: pnpm build

  # ---------------------------------------------------------------- Rust
  rust:
    name: Rust 校验
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # media-bridge 是同级自有仓库（Cargo.toml 里 `path = "../../media-bridge/..."`）
      - name: 检出 media-bridge（源码）
        uses: actions/checkout@v4
        with:
          repository: oneincase/media-bridge
          path: media-bridge-src

      - name: 移到仓库平级目录
        run: mv media-bridge-src ../media-bridge

      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            xdg-utils

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 造出前端产物占位（冷克隆下 `cargo check` 必失败）
        # `dist/` 是构建产物、不在仓库里，冷克隆下不存在。但：
        #   · `tauri_build::build()` 会校验 `bundle.resources` 里声明的**每一条**路径，
        #     缺一条就是 `resource path ... doesn't exist` → build script exit 1。
        #     三个平台 conf 里属于前端产物的都是同样两条：`../dist/renderer`、
        #     `../dist/assets`（另一条 `bundled/libsteam_api.so` 由 build.rs 生成，
        #     不能占位 —— 占位会把"复制失败"盖掉）；
        #   · `tauri::generate_context!` 的 codegen 还要求 frontendDist（`../dist`）存在，
        #     否则 panic「frontendDist ... doesn't exist」。
        # 本机有 dev 产物所以看不见，CI 上这一步之前从没绿过。
        # 本 job 只做类型检查，前端内容无关紧要 —— 造最小占位即可，不为了它去装 pnpm
        # 跑一遍前端（真前端由 web job 负责，见文件头部「只跑该跑的」）。
        run: |
          mkdir -p dist/renderer dist/assets
          printf '%s\n' '<!doctype html>' '<title>CI 占位产物：cargo check 不读前端内容</title>' > dist/index.html
          cp dist/index.html dist/renderer/index.html
          cp dist/index.html dist/assets/ci-stub.html

      # ---- 阻断档 ----

      - name: Cargo.lock 是否与 Cargo.toml 一致
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: 编译全部目标（含测试）
        # --all-targets：测试代码也要能编过，否则"本地没编测试"的坏改动会溜进 main
        working-directory: src-tauri
        run: cargo check --all-targets

      # ---- fmt / clippy：棘轮档（基线在 scripts/gate-baseline.json，只许收紧）----
      # 比基线差才红（阻断），比基线好提示收紧；工具链/平台没测过时放行并打印读数。
      # 拆成两步不是为了语义，是为了 Actions UI 里能看出是哪项涨了。

      - name: rustfmt 差异（棘轮：不新增）
        run: node scripts/gate-ratchet.mjs --only fmt

      - name: clippy 警告（棘轮：不新增）
        run: node scripts/gate-ratchet.mjs --only clippy

      - name: 单元测试（报告）
        continue-on-error: true
        working-directory: src-tauri
        run: |
          echo "本机基线：249 passed / 3 failed / 2 ignored —— 3 例失败是沙箱不给权限"
          echo "（download::pty 要分配 PTY、keychain 要访问钥匙串），非代码缺陷，基线同样失败。"
          echo "请在 PR 描述里贴**本地** cargo test --lib 的通过数与自己基线的对比。"
          cargo test --lib

  # ---------------------------------------------------------------- 汇总
  # 分支保护只需要勾这一个 check：分档逻辑变化时不用去改 GitHub 设置。
  summary:
    name: PR 校验汇总
    needs: [scope, rules, web, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总结果
        env:
          SCOPE: ${{ needs.scope.result }}
          RULES: ${{ needs.rules.result }}
          WEB: ${{ needs.web.result }}
          RUST: ${{ needs.rust.result }}
        run: |
          echo "变更范围=$SCOPE　提交规则=$RULES　前端=$WEB　Rust=$RUST"
          failed=false
          for r in "$SCOPE" "$RULES"; do
            [ "$r" = "success" ] || failed=true
          done
          # 前端 / Rust 可能是 skipped（本次没改到那条路径），skipped 不算失败
          for r in "$WEB" "$RUST"; do
            case "$r" in success|skipped) ;; *) failed=true ;; esac
          done
          if [ "$failed" = true ]; then
            echo "::error title=校验未通过（PR / 推送 / 手动）::看上面各 job 的日志；规则见 docs/pr-rules.md"
            exit 1
          fi
          echo "全部通过 ✅"
