name: 打包 Windows（NSIS 安装器 + MSI）

# 推送形如 v0.1.0 的标签时触发（tag 号需与 src-tauri/tauri.conf.json 的 version 一致）。
on:
  push:
    tags:
      - 'v*'
  # 也可以在 Actions 页面手动触发
  workflow_dispatch: {}

# 需要读取仓库 + 写 release 附件
permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    # windows-latest 自带 MSVC 工具链与 Windows SDK，Tauri 需要的 WebView2 也在系统里（Win11）。
    # NSIS 与 WiX 由 tauri-bundler 在构建时自动下载，无需预装。
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # webwallgl 是自维护渲染库（package.json 里 file:../webwallgl-github/dist/lib），
      # 需先拉到仓库平级目录并构建出 dist/lib，否则 pnpm install 解析不到
      - name: 检出 webwallgl
        uses: actions/checkout@v4
        with:
          repository: oneincase/webwallgl
          path: webwallgl-github-src

      # actions/checkout 不允许直接检出到 workspace 外，先落到子目录再移到平级
      - name: 移动到仓库平级目录
        shell: bash
        run: mv webwallgl-github-src ../webwallgl-github

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          # Windows 宿主的默认目标就是 msvc，显式写出来是给 rust-cache 与后续工具链改动兜底
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 构建 webwallgl 库产物（dist/lib）
        working-directory: ../webwallgl-github
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Tauri（.exe 安装器 + .msi）
        # beforeBuildCommand 会先跑 pnpm --filter @we/desktop build 生成前端 dist/，
        # 再编译 Rust release 并打包 nsis/msi（targets 在 tauri.conf.json）。
        run: pnpm tauri build

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperEM-windows-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: 把安装包附加到对应 tag 的 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
