name: 打包 Windows（x64 + ARM64，NSIS 安装器 + MSI）

# 推送形如 v0.1.0 的标签时触发（tag 号需与 src-tauri/tauri.conf.json 的 version 一致）。
on:
  push:
    tags:
      - 'v*'
  # 也可以在 Actions 页面手动触发
  workflow_dispatch: {}

# 需要读取仓库 + 写 release 附件
permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    # windows-latest 自带 MSVC（含 ARM64 工具链）与 Windows SDK；NSIS 与 WiX 由
    # tauri-bundler 在构建时自动下载，无需预装。
    #
    # ARM64 在 x64 runner 上**交叉编译**：GitHub 目前没有稳定的 arm64 Windows
    # runner 标签，所以装上 aarch64-pc-windows-msvc 目标，并把 MSVC 环境切到
    # VS 自带的 ARM64 工具链（见 msvc-dev-cmd 步骤）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            label: x64
          - target: aarch64-pc-windows-msvc
            label: arm64
            msvc_arch: arm64

    runs-on: windows-latest
    name: Windows-${{ matrix.label }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # webwallgl 是自维护渲染库（package.json 里 file:../webwallgl-github/dist/lib），
      # 需先拉到仓库平级目录并构建出 dist/lib，否则 pnpm install 解析不到
      - name: 检出 webwallgl
        uses: actions/checkout@v4
        with:
          repository: oneincase/webwallgl
          path: webwallgl-github-src

      # actions/checkout 不允许直接检出到 workspace 外，先落到子目录再移到平级
      - name: 移动到仓库平级目录
        shell: bash
        run: mv webwallgl-github-src ../webwallgl-github

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          # 显式写出来是给 rust-cache 与后续工具链改动兜底；arm64 由矩阵决定
          targets: ${{ matrix.target }}
          components: clippy,rustfmt

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 构建 webwallgl 库产物（dist/lib）
        working-directory: ../webwallgl-github
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 切换 MSVC 工具链到 ARM64（仅 arm64 行）
        # 交叉编译要用 VS 的 ARM64 cl.exe/link.exe；该 action 把环境导出到后续步骤
        if: matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: 钉死 MSVC 的 ARM64 link.exe（仅 arm64 行）
        # 只靠 PATH 不够稳：runner 的 `C:\Program Files\Git\usr\bin` 里也有一份
        # link.exe（coreutils 的 link），rustc 会解析到它并报 `linking with link.exe
        # failed`（v0.5.0 发布时 arm64 就挂在这，日志显示它调的是 Git 那份）。
        # 改用 Rust 官方的 CARGO_TARGET_<TRIPLE>_LINKER 指到绝对路径。
        if: matrix.msvc_arch
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\arm64\link.exe",
            "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostarm64\arm64\link.exe"
          )
          $link = $null
          foreach ($c in $candidates) {
            $link = Get-ChildItem -Path $c -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if ($link) { break }
          }
          if (-not $link) { throw "找不到 MSVC ARM64 的 link.exe" }
          Write-Host "MSVC ARM64 linker = $link"
          "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=$link" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 构建 Tauri（.exe 安装器 + .msi）
        # beforeBuildCommand 会先跑 pnpm --filter @we/desktop build 生成前端 dist/，
        # 再编译 Rust release 并打包 nsis/msi（targets 见 tauri.windows.conf.json）。
        # 显式 --target：产物落在 target/<triple>/release/bundle/ 下，两个架构互不覆盖。
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperEM-windows-${{ matrix.label }}-${{ github.ref_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: 把安装包附加到对应 tag 的 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          draft: false
          prerelease: false
