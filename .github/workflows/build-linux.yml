name: 打包 Linux（x64 + ARM64，deb + AppImage）

# 推送形如 v0.1.0 的标签时触发（tag 号需与 src-tauri/tauri.conf.json 的 version 一致）。
on:
  push:
    tags:
      - 'v*'
  # 也可以在 Actions 页面手动触发
  workflow_dispatch: {}

# 需要读取仓库 + 写 release 附件
permissions:
  contents: write

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    # 发布前置检查（三处版本一致 / tag 对得上 / CHANGELOG 已归段）：几秒钟拦在
    # 最便宜的 runner 上 —— 不过，下面这个按分钟计费的构建根本不会启动。
    # 规则见 docs/pr-rules.md §8。
    uses: ./.github/workflows/release-preflight.yml

  build-linux:
    needs: [preflight]
    # 两个架构都用**对应架构的原生 runner**，不做交叉编译（交叉到 arm64 需要整套
    # arm64 sysroot + webkit2gtk 库，成本远高于直接用 arm runner）。
    # 两行都用 22.04 底座（x64 → ubuntu-22.04、arm64 → ubuntu-22.04-arm，
    # 公共仓库均可用的原生 arm64 runner）：glibc 基线 2.35，deb/AppImage 在
    # **Ubuntu 22.04 及以上**（22.04 / 24.04 / 26.04…）都能直接装。
    # 24.04 底座编出来的要 glibc 2.39，22.04 用户装不上，故 arm64 也不用它。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: x64
            updater_arch: x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: arm64
            updater_arch: aarch64

    runs-on: ${{ matrix.os }}
    name: Linux-${{ matrix.label }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 前端渲染库 webwallgl 自 3.0.0 起走 npm 依赖（registry 上的 webwallgl@^3.0.0），
      # 不再需要平级检出源码、也不再需要先构建 dist/lib。

      # media-bridge 是同级自有仓库（src-tauri/Cargo.toml 里
      # path = "../../media-bridge/crates/media-bridge"），缺了它 cargo 直接报
      # 找不到 path 依赖；纯 Rust 依赖，检出即可，无需额外构建步骤
      - name: 检出 media-bridge
        uses: actions/checkout@v4
        with:
          repository: oneincase/media-bridge
          path: media-bridge-src

      # actions/checkout 不允许直接检出到 workspace 外，先落到子目录再移到平级
      - name: 移动 media-bridge 到仓库平级目录
        run: mv media-bridge-src ../media-bridge

      - name: 安装 Tauri Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            xdg-utils

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Tauri（.deb + .AppImage）
        # beforeBuildCommand 会先跑 pnpm --filter @we/desktop build 生成前端 dist/，
        # 再编译 Rust release 并打包 deb/appimage（targets 见 tauri.linux.conf.json）。
        # 显式 --target：产物落在 target/<triple>/release/bundle/ 下，两架构互不覆盖。
        env:
          # runner 镜像不带 FUSE 后，linuxdeploy 的 AppImage 起不来（秒退，
          # 表现为 "failed to run linuxdeploy"）；官方无 FUSE 运行模式兜底
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # linuxdeploy 依赖解析（不认 $ORIGIN/../ 风格的 rpath）要能找到
          # libsteam_api.so 才肯把它部署进 AppImage：把 vendored sdk 目录给它
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/sdk/linux64:${{ github.workspace }}/src-tauri/sdk/linuxarm64
          # updater 签名密钥（createUpdaterArtifacts 生成 .AppImage.sig 用）。
          # 私钥内容存 Secrets：TAURI_SIGNING_PRIVATE_KEY（无密码，PASSWORD 留空串）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperEM-linux-${{ matrix.label }}-${{ github.ref_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: 把安装包附加到对应 tag 的 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          draft: false
          prerelease: false

      # updater 清单（应用内更新的端点）：AppImage 本身就是下载体（v2
      # createUpdaterArtifacts 不再打 tar.gz），两个架构各写各的文件名，无竞态。
      # 注意：deb 安装的用户 updater 用不了（只覆盖 AppImage），应用内会引导去下载页。
      - name: 生成并上传 updater 更新清单
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --json body -q .body > "$RUNNER_TEMP/release-notes.md" || : > "$RUNNER_TEMP/release-notes.md"
          node scripts/gen-update-manifest.mjs \
            --repo "${{ github.repository }}" \
            --tag "$GITHUB_REF_NAME" \
            --file "latest-linux-${{ matrix.updater_arch }}.json" \
            --target "linux-${{ matrix.updater_arch }}" \
            --asset src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$GITHUB_REF_NAME" "latest-linux-${{ matrix.updater_arch }}.json" \
            --repo "${{ github.repository }}" --clobber

  # ------------------------------------------------------------------------- #
  # KDE/X11 会话冒烟：在真 KDE 会话（Xvfb + kwin_x11 + plasmashell）里跑应用，
  # 断言桌面层窗口类型/堆叠顺序/存活无 panic。脚本与断言见
  # docs/kde-adaptation-plan.md §6.2，说明见 docs/kde-packaging-notes.md。
  #
  # 为什么测**已上传的 AppImage 产物**而不是重新编译：省掉第二次 20 分钟编译，
  # 且验的就是用户实际拿到的那个二进制。runner 无 FUSE，用 AppImage 运行时的
  # APPIMAGE_EXTRACT_AND_RUN=1 自解包模式直跑（与 build 作业里 linuxdeploy 的
  # 兜底开关同一个机制）。
  #
  # 为什么 continue-on-error: true：本作业是新增的，Plasma 5.27 底座上升级到
  # 真实 kwin/plasmashell 后的断言尚无 CI 实测记录；先只标红本作业、不阻塞 tag
  # 发布（发布门禁在 preflight）。CI 跑稳后删掉这一行即转为硬门禁。
  # 注：只跑 x64 一个架构 —— KDE 会话逻辑与架构无关，arm64 再跑一遍没有新增信息。
  kde-smoke:
    needs: [preflight, build-linux]
    continue-on-error: true
    runs-on: ubuntu-22.04
    name: "KDE-X11-smoke (x64)"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 x64 构建产物（deb + AppImage）
        uses: actions/download-artifact@v4
        with:
          name: WallpaperEM-linux-x64-${{ github.ref_name }}
          path: artifacts

      - name: 安装 KDE/X11 冒烟依赖
        # ubuntu-22.04 / 24.04 官方仓库只有 Plasma 5.27（kwin_x11 + plasmashell），
        # 够跑本作业的 X11 断言；Wayland 档需要的 Plasma 6 不在这里跑（§6.2 的实测修正）。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus-x11 xdotool x11-utils imagemagick \
            kwin-x11 plasma-workspace
          kwin_x11 --version || true
          plasmashell --version || true

      - name: 校验 deb 的依赖/建议声明
        # 断言「声明真的进了 control 文件」——配置写了但没生效是这类任务最典型的假绿。
        run: |
          set -euo pipefail
          deb=$(ls artifacts/*.deb | head -1)
          echo "== $deb"
          echo "-- Depends --"
          dpkg-deb -f "$deb" Depends
          echo "-- Recommends --"
          dpkg-deb -f "$deb" Recommends
          dpkg-deb -f "$deb" Depends | tr -d '\n' | grep -q 'libayatana-appindicator3-1' \
            || { echo "[FAIL] Depends 缺 libayatana-appindicator3-1（tray 运行时库）"; exit 1; }
          # 断言「打包资源真的进了 deb、且对 other 可读」：应用内一键启用要在运行时按
          # resource_dir()（Linux 非 AppImage = /usr/lib/<exe>）找到插件包，再以**普通用户**
          # 身份把它拷进 ~/.local/share/plasma/wallpapers/。资源映射写了没进包、或者
          # 带着 0600 进去（umask 077 的检出会这样），装机后按钮点了都是失败。
          echo "-- 打包资源 --"
          dpkg-deb -c "$deb" | awk '{print $NF}' | grep -E '^\./usr/lib/WallpaperEM/' | head -8
          for need in \
            "usr/lib/WallpaperEM/plasma-wallpaper/io.github.oneincase.wallpaperem/metadata.json" \
            "usr/lib/WallpaperEM/plasma-wallpaper/io.github.oneincase.wallpaperem/contents/ui/main.qml" \
            "usr/lib/WallpaperEM/renderer/index.html" \
            "usr/lib/WallpaperEM/libsteam_api.so" ; do
            line=$(dpkg-deb -c "$deb" | grep "\./$need\$" || true)
            [ -n "$line" ] || { echo "[FAIL] deb 里缺 ./$need"; exit 1; }
            echo "$line" | grep -q '^-rw-r--r--' \
              || { echo "[FAIL] ./$need 权限不是 0644（普通用户读不了）：$line"; exit 1; }
          done

      - name: 选定被测二进制（AppImage 无 FUSE 直跑）
        run: |
          set -euo pipefail
          app=$(ls "$GITHUB_WORKSPACE"/artifacts/*.AppImage | head -1)
          test -n "$app"
          chmod +x "$app"
          echo "APP=$app" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "被测二进制：$app"

      - name: 装 deb 并跑「应用内一键启用」端到端自检
        # 真的装包、真的把 plasmashell 桌面壁纸切过去、真的抓帧，跑完自动还原。
        # 这一步盯的是「只有装出来的包才会踩」的问题：打包资源没进包、资源权限不是
        # other 可读（0600 的坑）、resource_dir() 路径语义、renderer bundle 里没有
        # KDE 界面代码。AppImage 那条路资源在挂载点里，所以这里用 deb 装出来的二进制。
        run: |
          set -uo pipefail
          sudo apt-get install -y "$GITHUB_WORKSPACE"/artifacts/*.deb || sudo apt-get -f install -y
          APP_BIN=/usr/bin/WallpaperEM bash scripts/kde-plugin-enable-check.sh 2>&1 | tail -100

      - name: 跑 KDE/X11 冒烟
        env:
          # 保留 /tmp/kde-smoke.* 临时目录（kwin.log / app.log / screen.png）供下面上传
          KEEP_LOGS: '1'
          SMOKE_WITH_PLASMA: '1'
        run: bash scripts/linux-kde-smoke.sh

      - name: 上传冒烟日志与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kde-smoke-logs-${{ github.ref_name }}
          path: |
            /tmp/kde-smoke.*/**
            /tmp/kde-smoke-screen.png
          if-no-files-found: warn
