name: 打包 Linux（x64 + ARM64，deb + AppImage）

# 推送形如 v0.1.0 的标签时触发（tag 号需与 src-tauri/tauri.conf.json 的 version 一致）。
on:
  push:
    tags:
      - 'v*'
  # 也可以在 Actions 页面手动触发
  workflow_dispatch: {}

# 需要读取仓库 + 写 release 附件
permissions:
  contents: write

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    # 两个架构都用**对应架构的原生 runner**，不做交叉编译（交叉到 arm64 需要整套
    # arm64 sysroot + webkit2gtk 库，成本远高于直接用 arm runner）。
    # 两行都用 22.04 底座（x64 → ubuntu-22.04、arm64 → ubuntu-22.04-arm，
    # 公共仓库均可用的原生 arm64 runner）：glibc 基线 2.35，deb/AppImage 在
    # **Ubuntu 22.04 及以上**（22.04 / 24.04 / 26.04…）都能直接装。
    # 24.04 底座编出来的要 glibc 2.39，22.04 用户装不上，故 arm64 也不用它。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: x64
            updater_arch: x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            label: arm64
            updater_arch: aarch64

    runs-on: ${{ matrix.os }}
    name: Linux-${{ matrix.label }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # webwallgl 是自维护渲染库（package.json 里 file:../webwallgl-github/dist/lib），
      # 需先拉到仓库平级目录并构建出 dist/lib，否则 pnpm install 解析不到
      - name: 检出 webwallgl
        uses: actions/checkout@v4
        with:
          repository: oneincase/webwallgl
          path: webwallgl-github-src

      # media-bridge 同样是同级自有仓库（src-tauri/Cargo.toml 里
      # path = "../../media-bridge/crates/media-bridge"），缺了它 cargo 直接报
      # 找不到 path 依赖；纯 Rust 依赖，检出即可，无需额外构建步骤
      - name: 检出 media-bridge
        uses: actions/checkout@v4
        with:
          repository: oneincase/media-bridge
          path: media-bridge-src

      # actions/checkout 不允许直接检出到 workspace 外，先落到子目录再移到平级
      - name: 移动到仓库平级目录
        run: |
          mv webwallgl-github-src ../webwallgl-github
          mv media-bridge-src ../media-bridge

      - name: 安装 Tauri Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            xdg-utils

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 构建 webwallgl 库产物（dist/lib）
        working-directory: ../webwallgl-github
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Tauri（.deb + .AppImage）
        # beforeBuildCommand 会先跑 pnpm --filter @we/desktop build 生成前端 dist/，
        # 再编译 Rust release 并打包 deb/appimage（targets 见 tauri.linux.conf.json）。
        # 显式 --target：产物落在 target/<triple>/release/bundle/ 下，两架构互不覆盖。
        env:
          # runner 镜像不带 FUSE 后，linuxdeploy 的 AppImage 起不来（秒退，
          # 表现为 "failed to run linuxdeploy"）；官方无 FUSE 运行模式兜底
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # linuxdeploy 依赖解析（不认 $ORIGIN/../ 风格的 rpath）要能找到
          # libsteam_api.so 才肯把它部署进 AppImage：把 vendored sdk 目录给它
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/sdk/linux64:${{ github.workspace }}/src-tauri/sdk/linuxarm64
          # updater 签名密钥（createUpdaterArtifacts 生成 .AppImage.sig 用）。
          # 私钥内容存 Secrets：TAURI_SIGNING_PRIVATE_KEY（无密码，PASSWORD 留空串）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperEM-linux-${{ matrix.label }}-${{ github.ref_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: 把安装包附加到对应 tag 的 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          draft: false
          prerelease: false

      # updater 清单（应用内更新的端点）：AppImage 本身就是下载体（v2
      # createUpdaterArtifacts 不再打 tar.gz），两个架构各写各的文件名，无竞态。
      # 注意：deb 安装的用户 updater 用不了（只覆盖 AppImage），应用内会引导去下载页。
      - name: 生成并上传 updater 更新清单
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --json body -q .body > "$RUNNER_TEMP/release-notes.md" || : > "$RUNNER_TEMP/release-notes.md"
          node scripts/gen-update-manifest.mjs \
            --repo "${{ github.repository }}" \
            --tag "$GITHUB_REF_NAME" \
            --file "latest-linux-${{ matrix.updater_arch }}.json" \
            --target "linux-${{ matrix.updater_arch }}" \
            --asset src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$GITHUB_REF_NAME" "latest-linux-${{ matrix.updater_arch }}.json" \
            --repo "${{ github.repository }}" --clobber
